<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>
    <section id="screen-start">
        <img id="logo" src="images/logo.png">
        <header>
            <hgroup>
                <h1>Cute Quiz App</h1>
                <p>10 webdev questions . about 5 minutes</p>
            </hgroup>
        </header>

        <search>
            <label for="topic">Topic</label>
            <input id="topic" list="topic-list" placeholder="Pick or type a topic">
            <datalist id="topic-list">
                <option value="HTML"></option>
                <option value="CSS"></option>
                <option value="JavaScript"></option>
            </datalist>

            <label for="level">Level</label>
            <select id="level">
                <optgroup label="easy">
                    <option>Beginner</option>
                </optgroup>
                <optgroup label="hard">
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </optgroup>
            </select>
        </search>

        <details>
            <summary>How to play</summary>
            <p>Press <kbd>1</kbd> to <kbd>4</kbd> to pick an answer. Pass mark: <b>8/10</b>.</p>
        </details>

        <button id="btn-start">Start Quiz</button>
        <p><small>No data leves your browser.</small></p>

        <noscript>Please enable JavaScript to play.</noscript>
    </section>
    <script src="app.js"></script>
</body>

</html>
