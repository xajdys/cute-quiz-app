<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>
    <section id="screen-start" class="card">
        <img id="logo" src="images/logo.png" alt="Cute Quiz App Logo">
        <header>
            <hgroup>
                <h1>Cute Quiz App</h1>
                <p>10 webdev questions . about 5 minutes</p>
            </hgroup>
        </header>

        <search>
            <label for="topic">Topic</label>
            <input id="topic" list="topic-list" placeholder="Pick or type a topic">
            <datalist id="topic-list">
                <option value="HTML"></option>
                <option value="CSS"></option>
                <option value="JavaScript"></option>
            </datalist>

            <label for="level">Level</label>
            <select id="level">
                <optgroup label="easy">
                    <option>Beginner</option>
                </optgroup>
                <optgroup label="hard">
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </optgroup>
            </select>
        </search>

        <details>
            <summary>How to play</summary>
            <p>Press <kbd>1</kbd> to <kbd>4</kbd> to pick an answer. Pass mark: <b>8/10</b>.</p>
        </details>

        <button id="btn-start">Start Quiz</button>
        <p><small>No data leaves your browser.</small></p>

        <noscript>Please enable JavaScript to play.</noscript>
    </section>

    <section id="screen-quiz" class="card" hidden>
        <!-- <p id="loading">Quiz screen loading...</p> -->

        <header>
            <p>Question <output id="q-number">1</output> of 10</p>
            <label for="q-progress">Progress</label>
            <progress id="q-progress" value="1" max="10">1 of 10</progress>
            <p>Time left: <output id="timer">30</output>s</p>
        </header>

        <div id="question-area"></div>
        <div class="actions">
            <menu>
                <li><button id="btn-skip">Skip</button></li>
            </menu>

            <button id="btn-next">Next</button>
        </div>
        <p>Score so far:
            <meter id="score-meter" min="0" max="10" value="0" low="3" high="7" optimum="10">0 of 10</meter>
        </p>
    </section>

    <template id="question-card">
        <h2 class="q-next"></h2>
        <fieldset>
            <legend>Choose one</legend>
            <label>
    <input type="radio" name="answer" value="0">
    <span class="opt-text"></span>
</label>

<label>
    <input type="radio" name="answer" value="1">
    <span class="opt-text"></span>
</label>

<label>
    <input type="radio" name="answer" value="2">
    <span class="opt-text"></span>
</label>

<label>
    <input type="radio" name="answer" value="3">
    <span class="opt-text"></span>
</label>
        </fieldset>
    </template>

    <section id="screen-results" class="card" hidden>
        <h2>You scored <output id="final-score">0/10</output></h2>
        <p id="verdict"></p>

        <canvas id="score-chart" width="240" height="240" role="img" aria-label="Donut chart of correct, wrong and skipped answers"></canvas>

        <table>
            <caption>Your answers</caption>
            <colgroup>
            <col class="col-num">
            <col>
            <col class="col-result">
            </colgroup>

            <thead>
                <tr>
                    <th scope="col">No.</th>
                    <th scope="col">Question</th>
                    <th scope="col">Result</th>
                </tr>
            </thead>

            <tbody id="results-body"></tbody>
        </table>

        <p>Finished <time id="finished-at"></time></p>
        <button id="btn-retry">Retry</button>
    </section>
    <script src="app.js"></script>
</body>

</html>
